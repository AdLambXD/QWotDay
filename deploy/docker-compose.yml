# NapCat（QQ NT 协议端）
# 启动：docker compose up -d
# 日志：docker logs -f napcat          （首次启动会打印 WebUI token）
# 升级：docker compose pull && docker compose up -d
#
# 同目录下的 .env 提供 NAPCAT_QQ / NAPCAT_UID / NAPCAT_GID（由 setup.sh 生成）
name: qwotday

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-0}
      - NAPCAT_GID=${NAPCAT_GID:-0}
      # 官方镜像用 ACCOUNT 这个环境变量做「快速登录」，等价于 qq --no-sandbox -q <QQ>
      - ACCOUNT=${NAPCAT_QQ:-}
      - TZ=Asia/Shanghai
    ports:
      # 都只监听本机：机器人脚本走 127.0.0.1，WebUI 走 SSH 隧道
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:6099:6099'
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    extra_hosts:
      - 'host.docker.internal:host-gateway'

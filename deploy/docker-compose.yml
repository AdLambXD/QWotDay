# NapCat（QQ NT 协议端）
# 启动：docker compose up -d
# 日志：docker logs -f napcat          （首次启动会打印 WebUI token）
# 升级：docker compose pull && docker compose up -d
name: qwotday

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      # 让容器内写出的文件属于当前用户，避免权限问题（id -u / id -g 的返回值）
      - NAPCAT_UID=${NAPCAT_UID:-0}
      - NAPCAT_GID=${NAPCAT_GID:-0}
      - TZ=Asia/Shanghai
    ports:
      # 都只监听本机：机器人脚本走 127.0.0.1，WebUI 走 SSH 隧道
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:6099:6099'
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    extra_hosts:
      - 'host.docker.internal:host-gateway'
